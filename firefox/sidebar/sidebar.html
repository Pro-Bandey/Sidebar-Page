<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link type="text/css" rel="stylesheet" href="sidebar.css">
</head>

<body>
  <!-- Modern Toolbar Header -->
  <header class="toolbar">
    <div class="toolbar-actions">
      <button id="back" class="btn-icon" title="Back" aria-label="Go Back">
        <svg class="icon">
          <use href="#icon-back"></use>
        </svg>
      </button>
      <button id="forward" class="btn-icon" title="Forward" aria-label="Go Forward">
        <svg class="icon">
          <use href="#icon-forward"></use>
        </svg>
      </button>
      <button id="reload" class="btn-icon" title="Reload Page" aria-label="Reload Page">
        <svg class="icon">
          <use href="#icon-reload"></use>
        </svg>
      </button>

      <!-- Integrated Address Input Field -->
      <div class="url-input-container">
        <input type="url" id="sidebar-url-input" class="sidebar-url-input" value="https://google.com/" placeholder="Enter URL and press Enter..."
          aria-label="Web address">
      </div>

      <button id="open" class="btn-icon" title="Open in tab" aria-label="Open in new tab">
        <svg class="icon">
          <use href="#icon-open"></use>
        </svg>
      </button>
      <button id="refresh" class="btn-icon" title="Refresh UI" aria-label="Refresh Sidebar UI">
        <svg class="icon">
          <use href="#icon-refresh"></use>
        </svg>
      </button>
      <button id="options" class="btn-icon" title="Open options page" aria-label="Open options page">
        <svg class="icon">
          <use href="#icon-options"></use>
        </svg>
      </button>
      <button id="hide" class="btn-icon" title="Hide toolbar temporarily" aria-label="Hide toolbar">
        <svg class="icon">
          <use href="#icon-hide"></use>
        </svg>
      </button>
    </div>
  </header>

  <!-- MD3-style Circular Progress Indicator -->
  <div class="loader" aria-live="polite" aria-label="Loading content">
    <div class="circular-progress"></div>
  </div>

  <!-- Content Frame -->
  <iframe frameborder="0" width="100%" height="100%" scrolling="auto" src="about:blank"></iframe>

  <!-- MD3-style Banner Onboarding Notice -->
  <div id="footer" role="alert">
    <div class="banner-content">
      <span class="banner-text">To start, please click here to open the Options Page, then set your desired website
        address.</span>
    </div>
  </div>

</body>

</html>
